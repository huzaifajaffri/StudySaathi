<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>StudySaathi: Exam Practice for Pakistani Students</title><meta name="description" content="Practice questions, revision planning and progress tracking for Matric, FSc, MDCAT, ECAT and university exams."><meta name="theme-color" content="#17324D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2317324D'/%3E%3Cpath d='M7 9h8v15H7zM17 9h8v15h-8z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M16 24V9' stroke='%23167D83' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--navy:#17324D;--teal:#167D83;--bg:#F8F8F5;--sf:#fff;--tx:#20272E;--tx2:#68737D;--bd:#E1E5E8;--ok:#287D55;--warn:#B7791F;--err:#C2413B;--ac:#17324D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12181E;--sf:#1B232B;--tx:#EDF0F2;--tx2:#9AA5AF;--bd:#2D3843;--ac:#5FB5BA;--navy:#244B70}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Manrope,system-ui,sans-serif;overflow-x:hidden}
header{background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.w{max-width:1000px;margin:0 auto;padding:0 16px}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ac);text-decoration:none}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;overflow-x:auto}nav a{padding:8px 10px;border-radius:4px;color:var(--tx2);text-decoration:none;font-size:14px}nav a[aria-current]{color:var(--ac);background:color-mix(in srgb,var(--teal) 12%,transparent);font-weight:500}
.db-status{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--bd);border-radius:999px;color:var(--tx2);font-size:12px;white-space:nowrap}.db-status i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 14%,transparent)}
.db-error{position:fixed;inset:auto 16px 16px;z-index:10;padding:12px 16px;border-radius:8px;background:var(--err);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.2)}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);padding:8px 14px;border-radius:5px}
button.p{background:var(--navy);color:#fff;border-color:var(--navy)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input,select{padding:8px 10px;border:1px solid var(--bd);border-radius:5px;background:var(--sf);max-width:100%}
h1{font-size:clamp(26px,5vw,38px);line-height:1.2;letter-spacing:-.035em;margin:0 0 12px;color:var(--ac);font-weight:800}h2{font-size:20px;letter-spacing:-.02em;margin:0 0 10px;font-weight:700}h3{font-size:16px;margin:0 0 6px;font-weight:700}
main{padding:24px 0 48px}.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:16px}.m{color:var(--tx2);font-size:14px}.tag{font-size:12px;border:1px solid var(--bd);padding:2px 6px;border-radius:3px;color:var(--tx2)}
.opt{display:block;width:100%;text-align:start;margin:6px 0}.opt[aria-pressed=true]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
.quiz-active{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ok{color:var(--ok)}.er{color:var(--err)}.wn{color:var(--warn)}.bar2{height:8px;background:var(--bd);border-radius:2px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--teal)}
.teacher-unread-dot{display:inline-block;width:12px;height:12px;margin-inline-start:8px;border-radius:50%;background:#17212b;color:transparent;font-size:0;vertical-align:middle;box-shadow:0 0 0 2px var(--sf)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}.sec{margin-bottom:28px}
header{border-top:3px solid var(--teal)}.logo{font-size:18px}nav a[aria-current]{box-shadow:inset 0 -2px var(--teal)}
.c{box-shadow:0 1px 2px rgba(23,50,77,.08)}
.hero{background:var(--navy);color:#fff;padding:32px 22px;border-radius:6px;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 32px)}
.hero{position:relative;overflow:hidden;border-radius:14px;background-image:radial-gradient(ellipse at 95% 5%,rgba(95,181,186,.25),transparent 34%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 32px)}
.hero>.c,.c{border-radius:10px}
.c{transition:transform .18s ease,box-shadow .18s ease}
.teacher-guidance{margin-top:14px;border-inline-start:4px solid var(--teal);background:color-mix(in srgb,var(--teal) 8%,var(--sf))}
button{transition:transform .15s ease,background-color .15s ease,border-color .15s ease,box-shadow .15s ease}
button:hover{border-color:color-mix(in srgb,var(--teal) 45%,var(--bd));box-shadow:0 3px 10px rgba(23,50,77,.1)}
button.p:hover{background:var(--teal);border-color:var(--teal)}
button:active{transform:translateY(1px)}
nav a{transition:color .15s ease,background-color .15s ease}
nav a:hover{color:var(--ac);background:color-mix(in srgb,var(--teal) 8%,transparent)}
input,select,textarea{border-radius:7px}
main{min-height:calc(100vh - 64px)}
@media(prefers-reduced-motion:no-preference){.c:hover{box-shadow:0 8px 24px rgba(23,50,77,.1)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.hero h1{color:#fff}.hero .m{color:#C3CFDA}.hero .c{color:var(--tx)}.hero .p{background:var(--teal);border-color:var(--teal)}.hero button:not(.p){background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
#f .g,#h .g{counter-reset:n}#f .c,#h .c{border-inline-start:3px solid var(--teal)}#f .c::before,#h .c::before{counter-increment:n;content:'0' counter(n);display:block;color:var(--teal);font-weight:600;font-size:13px;margin-bottom:4px}
h2{padding-bottom:6px;border-bottom:1px solid var(--bd)}
:root[data-theme=dark]{--bg:#12181E;--sf:#1B232B;--tx:#EDF0F2;--tx2:#9AA5AF;--bd:#2D3843;--ac:#5FB5BA;--navy:#244B70}
body{font-size:calc(16px*var(--fs,1))}.m,table,nav a{font-size:calc(14px*var(--fs,1))}h1{font-size:calc(clamp(26px,5vw,38px)*var(--fs,1))}h2{font-size:calc(20px*var(--fs,1))}h3{font-size:calc(16px*var(--fs,1))}textarea{padding:8px;border:1px solid var(--bd);border-radius:5px;background:var(--sf);color:inherit;font:inherit;max-width:100%}summary{cursor:pointer}
body.side{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
body.side header{position:sticky;top:0;height:100vh;height:100dvh;align-self:start;border-bottom:0;border-inline-end:1px solid var(--bd);overflow-y:auto}
body.side header .w{max-width:none;margin:0;padding:16px 12px;height:100%;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:6px}
body.side .logo{padding:2px 6px 14px;border-bottom:1px solid var(--bd);margin-bottom:6px}
body.side nav{flex-direction:column;flex-wrap:nowrap;flex:1;gap:2px;overflow-y:auto}
body.side nav a,body.side nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;color:var(--tx2);border-radius:5px;text-align:start;text-decoration:none;font-size:calc(14px*var(--fs,1))}
body.side nav a:hover,body.side nav button:hover{background:color-mix(in srgb,var(--tx) 7%,transparent)}
body.side nav [aria-current]{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--ac);font-weight:500;box-shadow:inset 3px 0 var(--teal)}
body.side header .w>button{width:100%}
body.side main{padding:28px 24px;margin:0 auto;width:100%}
body.side main>.row:has(>[data-tt]){display:none}
@media(max-width:800px){body.side{display:block}body.side header{position:sticky;top:env(safe-area-inset-top,0px);height:auto;border-inline-end:0;border-bottom:1px solid var(--bd);overflow:visible}body.side header .w{flex-direction:row;flex-wrap:wrap;height:auto;padding:8px 12px;align-items:center}body.side .logo{border:0;padding:0;margin:0;flex:1}body.side header .w>button{width:auto}body.side nav{flex-direction:row;flex:1 1 100%;order:3;overflow-x:auto;overflow-y:hidden}body.side nav a,body.side nav button{width:auto;flex:none;white-space:nowrap;padding:8px 10px}body.side nav [aria-current]{box-shadow:inset 0 -2px var(--teal)}body.side main{padding:16px 12px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style><link rel="stylesheet" href="theme.css"></head><body>
